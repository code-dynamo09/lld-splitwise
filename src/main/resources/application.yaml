spring:
  application:
    name: lld-splitwise

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: {DB_DRIVER_CLASS_NAME}

    hikari:
      pool-name: ${DB_POOL_NAME}
      maximum-pool-size: ${DB_MAX_POOL_SIZE}

      # limits how long an already open connection can stay active without transmitting data
      idle-timeout: ${DB_IDLE_TIMEOUT}.

      #  limits the time allowed to establish a brand-new connection
      connection-timeout: { DB_TIMEOUT }

